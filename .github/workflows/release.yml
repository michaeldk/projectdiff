name: Project Diff Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run type-check
          npm run test
          npm run build

      - name: Backend checks
        working-directory: backend
        run: |
          uv run ruff check .
          uv run pytest

      - name: Build Windows artifacts
        working-directory: backend
        run: uv run python ../build_windows.py

      - name: Parse release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Project Diff v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Project-Diff-portable.zip
            dist/Project-Diff.exe
          body: |
            ## Artifacts

            | File | Use |
            | --- | --- |
            | `Project-Diff-portable.zip` | Unzip and run `Project-Diff/Project-Diff.exe` |
            | `Project-Diff.exe` | Single self-extracting executable |

            **Platform:** Windows x64, Python 3.12 runtime bundled.

            **Requirements:** [Git for Windows](https://git-scm.com/download/win) on `PATH` (the app shells out to `git`).

            **WebView2:** Uses the system [WebView2 Evergreen](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) runtime (typical on Windows 11). It is not bundled.

            **Code signing:** These builds are **unsigned**. Windows SmartScreen may show an "Unknown publisher" warning the first time you run the app — choose *Run anyway* if you trust this release.

            **Settings:** `%APPDATA%\ProjectDiff\settings.json` (exclude patterns and theme).
