[project]
name = "project-diff"
version = "0.1.0"
description = "Compare two git repositories and selectively apply diffs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.0",
]

[project.scripts]
project-diff = "project_diff.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_diff"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
packaging = [
    "pyinstaller>=6.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]